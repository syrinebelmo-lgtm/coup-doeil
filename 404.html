<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aperçu introuvable · Rob Jill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
:root { --papier: #f2f3f7; --encre: #181b2d; --douce: #565b73; --orange: #f2672e; }
@media (prefers-color-scheme: dark) { :root { --papier: #111321; --encre: #eceef6; --douce: #a4a9c0; --orange: #ff8650; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--papier); color: var(--encre); font: 17px/1.6 "Instrument Sans", system-ui, sans-serif; padding: 24px; }
main { max-width: 34rem; display: grid; gap: 1rem; }
h1 { font: 400 clamp(2.2rem, 6vw, 3.2rem)/1.05 "Gloock", Georgia, serif; margin: 0; }
p { margin: 0; color: var(--douce); }
a { color: var(--orange); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Cet aperçu n'existe pas ou n'est plus en ligne.</h1>
  <p>Vérifiez le code reçu par SMS : il fait 6 caractères. Les aperçus restent en ligne environ une semaine.</p>
  <p><a href="/coup-doeil/">Saisir un autre code</a> ou appelez Rob au 06 00 00 00 00.</p>
</main>
</body>
</html>
